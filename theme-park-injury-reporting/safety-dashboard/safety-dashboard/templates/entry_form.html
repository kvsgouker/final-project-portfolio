<!DOCTYPE html>
<html>
<head>
    <title>Incident Report Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">

    <h2 class="mb-4">Theme Park Incident Report</h2>

    <form method="POST" action="/submit">

        <div class="row mb-3">
            <div class="col">
                <label class="form-label">Company</label>
                <select id="company" name="company" class="form-select" onchange="populateParks()">
                    {% for company in drilldown_json.keys() %}
                    <option value="{{ company }}">{{ company }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col">
                <label class="form-label">Theme Park</label>
                <select id="park" name="theme_park" class="form-select" onchange="populateRides()"></select>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col">
                <label class="form-label">Ride Name</label>
                <select id="ride" name="ride_name" class="form-select"></select>
            </div>
            <div class="col">
                <label class="form-label">Incident Date</label>
                <input type="date" name="incident_date" class="form-control" required>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col">
                <label class="form-label">Age</label>
                <select name="age_group" class="form-select">
                    <option value="<10">&lt;10</option>
                    <option value="10–17">10–17</option>
                    <option value="18–40">18–40</option>
                    <option value="41–60">41–60</option>
                    <option value="60+">60+</option>
                    <option value="Unknown">Unknown</option>
                </select>
            </div>
            <div class="col">
                <label class="form-label">Gender</label>
                <select name="gender" class="form-select">
                    <option>Male</option>
                    <option>Female</option>
                    <option>Nonbinary</option>
                    <option>Unknown</option>
                    <option>Prefer not to say</option>
                </select>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Injury Location</label>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="injury_location" value="Head"> Head / Face<br>
                <input class="form-check-input" type="checkbox" name="injury_location" value="Back"> Neck / Back<br>
                <input class="form-check-input" type="checkbox" name="injury_location" value="Arm"> Arm / Hand<br>
                <input class="form-check-input" type="checkbox" name="injury_location" value="Leg"> Leg / Foot<br>
                <input class="form-check-input" type="checkbox" name="injury_location" value="Chest"> Abdomen / Chest<br>
                <input class="form-check-input" type="checkbox" name="injury_location" value="Internal"> Internal / Illness<br>
                <input class="form-check-input" type="checkbox" name="injury_location" value="Unknown"> Unknown
            </div>
        </div>

        <div class="row mb-3">
            <div class="col">
                <label class="form-label">Severity</label>
                <select name="severity" class="form-select">
                    <option>Minor</option>
                    <option>Moderate</option>
                    <option>Serious</option>
                    <option>Fatal</option>
                    <option>Unknown</option>
                </select>
            </div>
            <div class="col">
                <label class="form-label">Medical Attention</label>
                <select name="medical_attention" class="form-select">
                    <option>Yes</option>
                    <option>No</option>
                    <option>Unknown</option>
                </select>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Injury Type</label>
            <select name="injury_type" class="form-select">
                <option>Fall / Slipped</option>
                <option>Collision</option>
                <option>Dizziness / Fainting</option>
                <option>Ride Malfunction</option>
                <option>Thrown / Ejection</option>
                <option>Seizure / Illness</option>
                <option>Burn / Wound / Cut</option>
                <option>Psychological / Panic</option>
                <option>Other</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Ride Status</label>
            <select name="ride_status" class="form-select">
                <option>In motion</option>
                <option>Loading/Unloading</option>
                <option>Emergency stop</option>
                <option>Queue / Waiting</option>
                <option>Unknown</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Contributing Factor</label>
            <select name="contributing_factor" class="form-select">
                <option>Guest behavior</option>
                <option>Operator error</option>
                <option>Ride malfunction</option>
                <option>Weather</option>
                <option>Unknown</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Incident Description</label>
            <textarea name="description" class="form-control" rows="4"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Submit Report</button>

    </form>
    <script>
        const menuData = {{ drilldown_json | tojson }};

        function populateParks() {
            const company = document.getElementById("company").value;
            localStorage.setItem("lastCompany", company);

            const parkSelect = document.getElementById("park");
            const parks = Object.keys(menuData[company] || {});
            parkSelect.innerHTML = "";

            parks.forEach(park => {
                const opt = document.createElement("option");
                opt.value = park;
                opt.textContent = park;
                const lastPark = localStorage.getItem("lastPark");
                if (lastPark && lastPark === park) {
                    opt.selected = true;
                }
                parkSelect.appendChild(opt);
            });

            populateRides();
        }

        function populateRides() {
            const company = document.getElementById("company").value;
            const park = document.getElementById("park").value;
            localStorage.setItem("lastPark", park);

            const rideSelect = document.getElementById("ride");
            const rides = (menuData[company] || {})[park] || [];
            rideSelect.innerHTML = "";

            rides.forEach(ride => {
                const opt = document.createElement("option");
                opt.value = ride;
                opt.textContent = ride;
                if (localStorage.getItem("lastRide") === ride) {
                    opt.selected = true;
                }
                rideSelect.appendChild(opt);
            });
        }

        function restoreSelections() {
            const company = localStorage.getItem("lastCompany");
            if (company && menuData[company]) {
                document.getElementById("company").value = company;
            }
            populateParks(); // Will call populateRides automatically
        }

        document.getElementById("company")?.addEventListener("change", () => {
            localStorage.setItem("lastCompany", document.getElementById("company").value);
        });

        document.getElementById("park")?.addEventListener("change", () => {
            localStorage.setItem("lastPark", document.getElementById("park").value);
        });

        document.getElementById("ride")?.addEventListener("change", () => {
            localStorage.setItem("lastRide", document.getElementById("ride").value);
        });

        window.onload = restoreSelections;
    </script>

</body>
</html>
