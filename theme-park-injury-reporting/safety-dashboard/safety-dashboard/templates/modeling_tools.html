<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modeling Tools</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">
    <h1 class="mb-4">Modeling Tools</h1>
    <p class="lead">Use guest and ride features to predict injury outcomes.</p>

    <form action="/model/predict" method="post" class="border p-4 rounded bg-light">
        <h5 class="mb-3">Predict Injury Location & Severity</h5>

        <div class="row mb-3">
            <div class="col">
                <label for="age_group" class="form-label">Age Group</label>
                <select class="form-select" id="age_group" name="age_group" required>
                    <option>Under 12</option>
                    <option>18–40</option>
                    <option>41–60</option>
                    <option>60+</option>
                </select>
            </div>
            <div class="col">
                <label for="gender" class="form-label">Gender</label>
                <select class="form-select" id="gender" name="gender" required>
                    <option>Female</option>
                    <option>Male</option>
                    <option>Nonbinary</option>
                    <option>Other</option>
                </select>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col">
                <label for="month" class="form-label">Month</label>
                <select class="form-select" id="month" name="month" required>
                    {% for m in ["January", "February", "March", "April", "May", "June", "July",
                                 "August", "September", "October", "November", "December"] %}
                        <option>{{ m }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col">
                <label for="ride_type" class="form-label">Ride Type</label>
                <select class="form-select" id="ride_type" name="ride_type" required>
                    <option>coaster</option>
                    <option>water</option>
                    <option>other</option>
                </select>
            </div>
        </div>

        <button type="submit" class="btn btn-info">Predict</button>
    </form>

    <div class="mt-4">
        <a href="/" class="btn btn-outline-secondary">← Back to Home</a>
    </div>
</body>
</html>
