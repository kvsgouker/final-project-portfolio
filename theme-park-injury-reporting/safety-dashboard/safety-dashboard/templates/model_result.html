<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prediction Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">
    <h1 class="mb-4">Prediction Result</h1>

    <div class="card">
        <div class="card-body">
            <h5 class="card-title">Input Summary</h5>
            <p><strong>Age Group:</strong> {{ age_group }}</p>
            <p><strong>Gender:</strong> {{ gender }}</p>
            <p><strong>Month:</strong> {{ month }}</p>
            <p><strong>Ride Type:</strong> {{ ride_type }}</p>
        </div>
    </div>

    <div class="card mt-4 border-success">
        <div class="card-body">
            <h5 class="card-title text-success">Predicted Injury</h5>
            <p><strong>Likely Injury Location:</strong> {{ location }}</p>
            <p><strong>Likely Severity:</strong> {{ severity }}</p>
        </div>
    </div>

    <div class="mt-4">
        <a href="/model" class="btn btn-outline-primary">← Back to Modeling</a>
        <a href="/" class="btn btn-outline-secondary">Home</a>
    </div>
</body>
</html>
